<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambil Antrean - Kantpusku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🏥 Kantpusku</a>
            <a href="dashboard.html" class="btn btn-light btn-sm">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold text-primary mb-3" id="namaPuskesmasLabel">Pendaftaran Antrean</h3>
                    <p class="text-muted small" id="alamatPuskesmasLabel"></p>
                    <hr>
                    
                    <form id="formAntrean">
                        <div class="mb-3">
                            <label for="namaPasien" class="form-label">Nama Lengkap Pasien</label>
                            <input type="text" class="form-control" id="namaPasien" required placeholder="Masukkan nama pasien">
                        </div>
                        <div class="mb-3">
                            <label for="pilihPoli" class="form-label">Pilih Poli Tujuan</label>
                            <select class="form-select" id="pilihPoli" required>
                                <option value="" disabled selected>-- Pilih Poli --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="keluhanPasien" class="form-label">Keluhan Singkat (Opsional)</label>
                            <textarea class="form-control" id="keluhanPasien" rows="3" placeholder="Ceritakan keluhan Anda..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Daftar Antrean</button>
                    </form>
                </div>
            </div>

            <div class="col-md-5 mb-4 d-none" id="boxTiketAntrean">
                <div class="card border-primary shadow text-center">
                    <div class="card-header bg-primary text-white fw-bold">
                        TIKET ANTREAN DIGITAL
                    </div>
                    <div class="card-body py-4">
                        <h4 class="fw-bold mb-1" id="tiketPuskesmas">Nama Puskesmas</h4>
                        <p class="text-muted small mb-3" id="tiketPoli">Nama Poli</p>
                        
                        <div class="p-3 bg-light rounded my-3 border border-secondary border-dashed">
                            <span class="text-secondary small d-block mb-1">NOMOR URUT ANTREAN</span>
                            <h1 class="display-3 fw-bold text-success m-0" id="tiketNomor">00</h1>
                        </div>
                        
                        <h5 class="fw-bold text-dark mt-3" id="tiketPasien">Nama Pasien</h5>
                        <p class="text-muted small" id="tiketJam">Waktu Cetak: -</p>
                    </div>
                    <div class="card-footer bg-light text-muted small">
                        *Harap tunjukkan tiket ini kepada petugas loket.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/antrean.js"></script>
</body>
</html>
