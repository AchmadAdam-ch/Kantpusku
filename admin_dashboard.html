<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kantpusku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="admin_dashboard.html">🛠️ Kantpusku Admin</a>
            <div class="d-flex align-items-center justify-content-between ms-auto">
                <span class="text-white me-3" id="welcomeAdmin">Halo, Admin!</span>
                <button id="btnLogout" class="btn btn-danger btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">

        <!-- FORM TAMBAH PUSKESMAS -->
        <div class="card shadow-sm border-0 mb-5">
            <div class="card-body">
                <h4 class="fw-bold text-primary mb-3">➕ Tambah Puskesmas Baru</h4>
                <form id="formTambahPuskesmas">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nama Puskesmas</label>
                            <input type="text" class="form-control" id="inputNama" required placeholder="Contoh: Puskesmas Kenanga">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Alamat</label>
                            <input type="text" class="form-control" id="inputAlamat" required placeholder="Contoh: Jl. Sehat No. 10, Malang">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Link Gambar (opsional)</label>
                            <input type="text" class="form-control" id="inputGambar" placeholder="https://...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Info Tambahan (opsional)</label>
                            <input type="text" class="form-control" id="inputInfo" placeholder="Contoh: Buka 07.00 - 15.00, telp. 0341-xxxxxx">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Daftar Poli (pisahkan dengan koma)</label>
                            <input type="text" class="form-control" id="inputPoli" required placeholder="Contoh: Poli Umum, Poli Gigi, Poli KIA">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Simpan Puskesmas</button>
                </form>
            </div>
        </div>

        <!-- MONITORING ANTREAN REAL-TIME -->
        <h4 class="fw-bold mb-3">📡 Monitoring Antrean Real-Time</h4>
        <div class="row mb-5" id="monitorContainer">
            <p class="text-muted">Memuat data monitoring...</p>
        </div>

        <!-- DAFTAR PUSKESMAS + KONTROL RESET ANTREAN -->
        <h4 class="fw-bold mb-3">📋 Daftar Puskesmas & Kontrol Antrean</h4>
        <div class="row" id="puskesmasContainer">
            </div>

    </div>

    <!-- MODAL EDIT PUSKESMAS -->
    <div class="modal fade" id="modalEditPuskesmas" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formEditPuskesmas">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">✏️ Edit Puskesmas</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Nama Puskesmas</label>
                            <input type="text" class="form-control" id="editNama" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alamat</label>
                            <input type="text" class="form-control" id="editAlamat" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Link Gambar (opsional)</label>
                            <input type="text" class="form-control" id="editGambar" placeholder="https://...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Info Tambahan (opsional)</label>
                            <input type="text" class="form-control" id="editInfo">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Daftar Poli (pisahkan dengan koma)</label>
                            <input type="text" class="form-control" id="editPoli" required placeholder="Contoh: Poli Umum, Poli Gigi, Poli KIA">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
